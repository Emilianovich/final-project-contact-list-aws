name: '3 - Deploy ECS'
on:
  workflow_run:
    workflows: ['2 - Build and publish']
    types: [completed]
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: aws-dev
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: aws-dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - run: terraform -chdir=terraform init -backend-config=backend.hcl.example
      - run: python3 pipelines/deploy.py release.json
